name = "mjdevelopers"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (React build output)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "mjdevelopers-db"
database_id = "b607628a-b904-44f4-852b-7d5cb86bbeb0"  # अपना ID डालें

[vars]
ADMIN_TOKEN = "rana-bhaya"
